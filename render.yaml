services:
  - type: web
    name: census-income-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
